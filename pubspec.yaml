name: yumup
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  bloc: ^9.2.1
  cupertino_icons: ^1.0.2
  dartz: ^0.10.1
  dio: ^5.4.0
  equatable: ^2.0.5
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.3.0
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.3.0
  formz: ^0.8.0
  get_it: ^9.2.1
  go_router: ^17.3.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  injectable: ^2.3.0
  internet_connection_checker_plus: ^3.1.0
  intl: ^0.20.2
  lottie: ^3.3.3
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.15.0
  uuid: ^4.0.0

dev_dependencies:
  build_runner: ^2.4.0

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.0
  injectable_generator: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/
    - assets/images/

  fonts:
    - family: poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
